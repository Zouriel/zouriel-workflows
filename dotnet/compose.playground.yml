# The workflow playground on zouriel-server; Caddy routes zouriel.com/uilib/workflow-api/* here.
services:
  uilib-workflow-api:
    build:
      context: .
      dockerfile: samples/Zouriel.Workflows.Sample/Dockerfile
    container_name: uilib-workflow-api
    restart: unless-stopped
    environment:
      # Caddy reaches this container over the docker "proxy" network.
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
      Playground__MaxSandboxes: "150"
      Playground__IdleMinutes: "120"
    tmpfs:
      - /tmp/playground:size=512m,uid=1654
    mem_limit: 1g
    networks:
      - proxy

networks:
  proxy:
    external: true
